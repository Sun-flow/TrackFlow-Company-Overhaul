# Publishes the Milestone 1 website (uis/website/) to GitHub Pages on every push to production,
# so PageSpeed Insights and reviewers can open it at https://sun-flow.github.io/TrackFlow-Company-Overhaul/.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [production]
    paths:
      - "uis/website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Only the files the pages load; the CSS is committed already built (docs/decisions.md).
      - name: Collect the site
        run: |
          mkdir _site
          cp uis/website/*.html _site/
          cp -r uis/website/assets uis/website/dist uis/website/js _site/

      # Minify the published scripts; the repo keeps the readable, commented sources. Top-level names are kept,
      # so the classic scripts that share globals (form.js uses validation.js) still work together.
      - name: Minify the scripts
        run: npx --yes esbuild@0.25.10 _site/js/*.js --minify --outdir=_site/js --allow-overwrite

      # Put the stylesheet inside each published page so the first paint doesn't wait for a second request
      # (PageSpeed "render-blocking requests"). The repo keeps the <link> so the pages still open from disk.
      - name: Inline the stylesheet
        run: |
          python3 - <<'EOF'
          import pathlib
          css = pathlib.Path("_site/dist/styles.css").read_text().replace("url(../assets/", "url(assets/")
          link = '<link rel="stylesheet" href="dist/styles.css" />'
          for page in pathlib.Path("_site").glob("*.html"):
              html = page.read_text()
              assert html.count(link) == 1, f"{page.name}: stylesheet link not found"
              page.write_text(html.replace(link, f"<style>{css}</style>"))
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
